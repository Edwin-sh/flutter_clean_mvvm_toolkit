name: flutter_clean_mvvm_toolkit
description: A comprehensive Flutter toolkit for Clean Architecture with MVVM pattern. Provides ViewModels, Use Cases, Entities, Error Handling, and CRUD patterns for scalable Flutter applications.
version: 0.2.0
homepage: https://github.com/Edwin-sh/flutter_clean_mvvm_toolkit
repository: https://github.com/Edwin-sh/flutter_clean_mvvm_toolkit
issue_tracker: https://github.com/Edwin-sh/flutter_clean_mvvm_toolkit/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Functional Programming
  dartz: ^0.10.1
  
  # Value equality
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Testing
  mocktail: ^1.0.4

topics:
  - clean-architecture
  - mvvm
  - crud
  - viewmodel
  - flutter
